<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Font Awesome 6 (opcional, mas mantido) -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <!-- QRCode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-image: url('images/bg-codes.png');
            background-size: cover;
            background-position: center 30%;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #2c4a2e;
            height: 100vh;
            overflow: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Times New Roman', Times, serif;
        }

        .card-custom {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #c084fc;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px;
            border: none;
        }

        .btn-generate {
            background: #9333ea;
            border: none;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-weight: bold;
            width: 100%;
            transition: 0.3s;
        }

        .btn-generate:hover {
            background: #7e22ce;
        }

        /* Container do QR Code – centralizado e com fundo branco */
        #qrcode-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 15px;
            position: relative;
        }

        /* O canvas gerado pelo QRCode.js fica dentro deste container */
        #qrcode-container canvas {
            display: block !important;
            max-width: 100%;
            height: auto;
        }

        /* Ícone centralizado sobre o QR Code */
        .qr-icon-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;   /* para não atrapalhar cliques */
            background: white;      /* fundo para destacar o ícone */
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px white; /* borda suave */
            font-size: 38px;        /* tamanho do ícone */
            line-height: 1;
            width: 52px;
            height: 52px;
        }

        .qr-icon-overlay i {
            font-size: 38px;
            color: #0d6efd;         /* primary do Bootstrap */
        }

        /* Ajuste para telas pequenas */
        @media (max-width: 500px) {
            .card-custom {
                padding: 20px;
            }
            .qr-icon-overlay {
                width: 44px;
                height: 44px;
                font-size: 32px;
            }
            .qr-icon-overlay i {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

    <div class="card-custom">
        <h2><i class="fas fa-qrcode"></i> Gerador de QR Code</h2>

        <input
        type="text"
        id="linkInput"
        class="form-control mb-3"
        placeholder="Digite o link da sua loja (https://exemplo.com/produto)"
        />

        <button class="btn-generate" onclick="gerarQRCode()">
            Gerar QR Code
        </button>

        <!-- Container do QR Code com ícone central -->
        <div id="qrcode-container">
            <div id="qrcode"></div>
            <!-- Ícone centralizado (aparece assim que o QR for gerado) -->
            <div class="qr-icon-overlay" id="qrIconOverlay">
                <i class="bi bi-heart-pulse text-dark"></i>
            </div>
        </div>
    </div>

    <script>
        function gerarQRCode() {
            let link = document.getElementById("linkInput").value;
            let qrContainer = document.getElementById("qrcode");

            // Limpa o QR anterior (mantém o ícone, pois ele está fora do #qrcode)
            qrContainer.innerHTML = "";

            if (link.trim() === "") {
                alert("Digite um link primeiro!");
                return;
            }

            // Gera o QR Code com tamanho fixo (220x220)
            new QRCode(qrContainer, {
                text: link,
                width: 220,
                height: 220,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H // maior correção de erro
            });

            // O ícone já existe no HTML (div .qr-icon-overlay)
            // Se quiser garantir que ele fique visível, nada mais é necessário.
            // Mas podemos forçar a exibição caso tenha sido ocultado.
            const icon = document.getElementById("qrIconOverlay");
            if (icon) {
                icon.style.display = "flex";
            }
        }

        // (Opcional) Gerar um QR Code de exemplo ao carregar a página?
        // Por padrão deixamos vazio. Se quiser, descomente a linha abaixo:
        // window.onload = function() { document.getElementById("linkInput").value = "https://exemplo.com"; gerarQRCode(); };
    </script>

</body>
</html>
