        <script>
            /* ==========================================================
ETAPA 66
========================================================== */

function obterConversas(){

    return JSON.parse(

    localStorage.getItem(

    "conversas") || "[]"

    );

}

/* Backup */

createBackup.onclick=function(){

    const dados={

        data:new Date(),

        versao:"1.0",

        conversas:obterConversas()

    };

    const blob=

    new Blob(

    [

    JSON.stringify(

    dados,

    null,

    2)

    ],

    {

    type:"application/json"

    });

    const url=

    URL.createObjectURL(

    blob);

    const a=

    document.createElement("a");

    a.href=url;

    a.download=

    "backup_whatsapp.json";

    a.click();

    lastBackup.innerHTML=

    new Date()

    .toLocaleString();

    backupStatus.innerHTML=

    "Backup criado.";

    backupStatus.className=

    "sync-success";

};

/* Restaurar */

restoreBackup.onclick=function(){

    backupFile.click();

};

backupFile.onchange=function(){

    const ficheiro=

    this.files[0];
