<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dicionário de Doenças - VITALINKA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* Estilo geral - Mantido o glassmorphism */
        body {
            font-family: 'Times New Roman', Times, serif;
            background-image: url('images/dictionary.png');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .container-fluid {
            position: relative;
            z-index: 1;
        }

        /* Estilo dos cards - Glassmorphism Cristalino */
        .disease-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .disease-card:hover {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        .disease-card .card-img-top {
            height: 180px;
            object-fit: cover;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .disease-card .card-body {
            color: #fff;
            padding: 1.25rem;
        }

        .disease-card .card-title {
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .disease-card .card-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .disease-card .badge-category {
            background: rgba(13, 110, 253, 0.4);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .disease-card .badge-severity {
            background: rgba(255, 193, 7, 0.4);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        /* Painel de Categorias - Glassmorphism */
        .category-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 20px;
        }

        .category-panel .category-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 20px;
            padding: 6px 16px;
            margin: 4px;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: 'Times New Roman', Times, serif;
        }

        .category-panel .category-btn:hover {
            background: rgba(13, 110, 253, 0.3);
            transform: scale(1.05);
        }

        .category-panel .category-btn.active {
            background: rgba(13, 110, 253, 0.4);
            border-color: rgba(13, 110, 253, 0.6);
        }

        /* Barra de Pesquisa - Glassmorphism */
        .search-section {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .search-section .form-control,
        .search-section .form-select {
            font-family: 'Times New Roman', Times, serif;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .search-section .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-section .form-control:focus,
        .search-section .form-select:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(13, 110, 253, 0.5);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .search-section .btn-outline-secondary {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-section .btn-outline-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Tela de Detalhes - Glassmorphism */
        .detail-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .detail-section .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .detail-section .detail-header img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-section .detail-header .title h2 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .detail-section .detail-header .title .subtitle {
            color: rgba(255, 255, 255, 0.7);
        }

        .detail-section .detail-content h5 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            border-bottom: 2px solid rgba(13, 110, 253, 0.3);
            padding-bottom: 10px;
            margin-bottom: 15px;
            margin-top: 25px;
        }

        .detail-section .detail-content p,
        .detail-section .detail-content li {
            color: rgba(255, 255, 255, 0.85);
            font-size: 1rem;
            line-height: 1.7;
        }

        .detail-section .detail-content ul {
            padding-left: 20px;
        }

        .detail-section .detail-content .faq-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 3px solid rgba(13, 110, 253, 0.4);
        }

        .detail-section .detail-content .faq-item strong {
            color: #fff;
        }

        .detail-section .detail-content .related-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            border-radius: 8px;
            padding: 10px 15px;
            margin: 5px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            color: #fff;
        }

        .detail-section .detail-content .related-card:hover {
            background: rgba(13, 110, 253, 0.3);
            transform: scale(1.05);
        }

        .detail-section .disclaimer {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #dc3545;
            padding: 15px 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-style: italic;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Indicadores de gravidade */
        .severity-low { color: #75f0a0; }
        .severity-moderate { color: #ffd75a; }
        .severity-high { color: #ff7a8a; }

        /* Botões */
        .btn-primary {
            background: rgba(13, 110, 253, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        .btn-primary:hover {
            background: rgba(13, 110, 253, 0.8);
        }

        .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Título da página */
        .page-title {
            font-family: 'Times New Roman', Times, serif;
            color: #fff;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .page-title .badge {
            background: rgba(13, 110, 253, 0.5);
            backdrop-filter: blur(5px);
        }

        /* Animação de entrada */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .detail-section .detail-header {
                flex-direction: column;
                text-align: center;
            }
            .detail-section .detail-header img {
                width: 100px;
                height: 100px;
            }
            .disease-card .card-img-top {
                height: 140px;
            }
            .category-panel .category-btn {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
        }

        /* Scroll suave */
        .smooth-scroll {
            scroll-behavior: smooth;
        }

        /* Ícones das seções */
        .section-icon {
            margin-right: 10px;
            color: rgba(13, 110, 253, 0.8);
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Cabeçalho -->
        <div class="row mb-4">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center flex-wrap">
                    <h2 class="page-title">
                        <i class="bi bi-book text-primary"></i> 
                        Dicionário de Doenças
                        <span class="badge bg-primary ms-2">VITALINKA</span>
                    </h2>
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-primary" id="btnFavoritos">
                            <i class="bi bi-heart"></i> Favoritos
                        </button>
                        <button class="btn btn-primary" id="btnHistorico">
                            <i class="bi bi-clock-history"></i> Histórico
                        </button>
                        <button class="btn btn-outline-light" id="btnModoLeitura">
                            <i class="bi bi-eye"></i> Modo Leitura
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Barra de Pesquisa -->
        <div class="search-section">
            <div class="row g-3">
                <div class="col-md-5">
                    <div class="input-group">
                        <input type="text" id="searchDisease" class="form-control" placeholder="Pesquisar por nome, sintoma, especialidade...">
                        <button class="btn btn-outline-secondary" type="button" id="btnSearch">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </div>
                <div class="col-md-4">
                    <select class="form-select" id="filterCategory">
                        <option value="">Todas as Categorias</option>
                        <option value="cardiovascular">Doenças Cardiovasculares</option>
                        <option value="respiratoria">Doenças Respiratórias</option>
                        <option value="neurologica">Doenças Neurológicas</option>
                        <option value="endocrina">Doenças Endócrinas</option>
                        <option value="infecciosa">Doenças Infecciosas</option>
                        <option value="gastrointestinal">Doenças Gastrointestinais</option>
                        <option value="dermatologica">Doenças Dermatológicas</option>
                        <option value="oncologica">Doenças Oncológicas</option>
                        <option value="pediatrica">Doenças Pediátricas</option>
                        <option value="ginecologica">Doenças Ginecológicas</option>
                        <option value="urologica">Doenças Urológicas</option>
                        <option value="saude_mental">Saúde Mental</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-light w-100" id="btnFiltros">
                        <i class="bi bi-funnel"></i> Filtros Avançados
                    </button>
                </div>
            </div>
        </div>

        <!-- Painel de Categorias -->
        <div class="category-panel">
            <div class="d-flex flex-wrap justify-content-center">
                <button class="category-btn active" data-category="all">Todas</button>
                <button class="category-btn" data-category="cardiovascular">❤️ Cardiovascular</button>
                <button class="category-btn" data-category="respiratoria">🫁 Respiratória</button>
                <button class="category-btn" data-category="neurologica">🧠 Neurológica</button>
                <button class="category-btn" data-category="endocrina">🔄 Endócrina</button>
                <button class="category-btn" data-category="infecciosa">🦠 Infecciosa</button>
                <button class="category-btn" data-category="gastrointestinal">🍽️ Gastrointestinal</button>
                <button class="category-btn" data-category="dermatologica">🧴 Dermatológica</button>
                <button class="category-btn" data-category="oncologica">🎗️ Oncológica</button>
                <button class="category-btn" data-category="pediatrica">👶 Pediátrica</button>
                <button class="category-btn" data-category="ginecologica">👩 Ginecológica</button>
                <button class="category-btn" data-category="urologica">🚻 Urológica</button>
                <button class="category-btn" data-category="saude_mental">🧘 Saúde Mental</button>
            </div>
        </div>

        <!-- Catálogo de Doenças -->
        <div id="catalogContainer">
            <div class="row" id="diseaseGrid">
                <!-- Cards serão inseridos via JavaScript -->
            </div>
        </div>

        <!-- Tela de Detalhes (inicialmente oculta) -->
        <div id="detailContainer" style="display: none;">
            <div class="detail-section" id="diseaseDetail">
                <!-- Conteúdo preenchido via JavaScript -->
            </div>
            <div class="mt-3">
                <button class="btn btn-primary" id="btnBackToCatalog">
                    <i class="bi bi-arrow-left"></i> Voltar ao Catálogo
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Filtros -->
    <div class="modal fade" id="filtersModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Filtros Avançados</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="filtersForm">
                        <div class="mb-3">
                            <label class="form-label">Gravidade</label>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="baixa" id="sevLow">
                                <label class="form-check-label" for="sevLow">Baixa</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="moderada" id="sevModerate">
                                <label class="form-check-label" for="sevModerate">Moderada</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="alta" id="sevHigh">
                                <label class="form-check-label" for="sevHigh">Alta</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sintomas</label>
                            <input type="text" class="form-control" id="filterSintomas" placeholder="Ex: febre, tosse, dor...">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnApplyFilters">Aplicar Filtros</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

                diagnostico: "O diagnóstico é feito por profissional de saúde mental, baseado em critérios clínicos e avaliação psicológica.",
                tratamento: ["Psicoterapia", "Medicamentos antidepressivos", "Mudanças no estilo de vida", "Grupos de apoio"],
                cuidados: ["Seguir o tratamento recomendado", "Manter contato com a rede de apoio", "Praticar autocuidado", "Não interromper o tratamento sem orientação"],
                complicacoes: ["Suicídio", "Problemas de relacionamento", "Prejuízo profissional", "Uso de substâncias"],
                faq: [
                    { pergunta: "A depressão é frescura?", resposta: "Não. É uma condição médica séria que requer tratamento adequado." },
                    { pergunta: "O tratamento da depressão é para sempre?", resposta: "Não necessariamente. Muitas pessoas se recuperam completamente com o tratamento adequado." }
                ],
                relacionados: ["Ansiedade", "Transtorno Bipolar", "Burnout"],
                imagem: "images/tristeza.jpg"
            }, {
                id: 5,
                nome: "COVID-19",
                categoria: "infecciosa",
                categoriaNome: "Doenças Infecciosas",
                especialidade: "Infectologia",
                gravidade: "alta",
                sintomas: ["Febre", "Tosse", "Falta de ar", "Cansaço", "Perda de olfato/paladar"],
                descricao: "Doença infecciosa causada pelo coronavírus SARS-CoV-2, que pode variar de leve a grave.",
                oque_e: "A COVID-19 é uma infecção respiratória causada pelo vírus SARS-CoV-2. Pode causar desde sintomas leves até síndrome respiratória aguda grave.",
                causas: ["Infecção pelo coronavírus SARS-CoV-2", "Transmissão por gotículas e aerossóis", "Contato com superfícies contaminadas"],
                fatores_risco: ["Idade avançada", "Comorbidades (hipertensão, diabetes)", "Imunossupressão", "Obesidade"],
                prevencao: ["Vacinação", "Uso de máscara", "Higiene das mãos", "Distanciamento social", "Ventilação de ambientes"],
                diagnostico: "Diagnóstico feito por teste PCR, teste antigênico ou teste sorológico, com base em sintomas e exposição.",
                tratamento: ["Repouso", "Hidratação", "Medicamentos sintomáticos", "Em casos graves, internação hospitalar"],
                cuidados: ["Isolamento durante o período de transmissibilidade", "Monitoramento dos sintomas", "Buscar ajuda médica em caso de piora"],
                complicacoes: ["Síndrome respiratória aguda grave (SRAG)", "Tromboses", "COVID longa", "Morte"],
                faq: [
                    { pergunta: "A vacina contra COVID-19 é segura?", resposta: "Sim. As vacinas passaram por rigorosos testes de segurança e eficácia." },
                    { pergunta: "Posso pegar COVID-19 depois de vacinado?", resposta: "Sim, mas o risco de doença grave é muito menor." }
                ],
                relacionados: ["Gripe", "Pneumonia", "Síndrome Respiratório"],
                imagem: "images/covid-19.jpg"
            }, {
                id: 6,
                nome: "Câncer de Mama",
                categoria: "oncologica",
                categoriaNome: "Doenças Oncológicas",
                especialidade: "Oncologia",
                gravidade: "alta",
                sintomas: ["Nódulo na mama", "Alteração na pele", "Secreção no mamilo", "Inchaço na axila"],
                descricao: "Doença maligna que se desenvolve nas células da mama, sendo o tipo mais comum de câncer em mulheres.",
                oque_e: "O câncer de mama ocorre quando as células da mama se multiplicam de forma descontrolada, formando tumores. Pode ser detectado precocemente com exames de rastreamento.",
                causas: ["Fatores genéticos", "Alterações hormonais", "Idade avançada", "Obesidade", "Consumo de álcool"],
                fatores_risco: ["Histórico familiar", "Mutações genéticas (BRCA1/BRCA2)", "Idade avançada", "Menarca precoce", "Menopausa tardia"],
                prevencao: ["Autoexame regular", "Mamografia anual", "Alimentação saudável", "Exercício físico", "Evitar consumo excessivo de álcool"],
                diagnostico: "Diagnóstico feito por mamografia, ultrassom, biópsia e exames de imagem complementares.",
                tratamento: ["Cirurgia", "Quimioterapia", "Radioterapia", "Hormonioterapia", "Terapia alvo"],
                cuidados: ["Seguir o tratamento recomendado", "Manter acompanhamento médico", "Cuidados com a saúde emocional", "Alimentação adequada"],
                complicacoes: ["Metástase", "Recidiva", "Efeitos colaterais do tratamento", "Impacto psicológico"],
                faq: [
                    { pergunta: "O câncer de mama tem cura?", resposta: "Sim, especialmente quando diagnosticado precocemente." },
                    { pergunta: "Todo nódulo na mama é câncer?", resposta: "Não. A maioria dos nódulos é benigna, mas deve ser avaliada por um médico." }
                ],
                relacionados: ["Câncer de Ovário", "Câncer de Colo do Útero", "Câncer de Próstata"],
                imagem: "images/cancer.jpg"
            }];

            // ===================== VARIÁVEIS GLOBAIS =====================
            let currentDisease = null;
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            let history = JSON.parse(localStorage.getItem('diseaseHistory')) || [];
            let filteredDiseases = [...diseases];
            let readingMode = false;

            // ===================== FUNÇÕES DE RENDERIZAÇÃO =====================

            // Renderizar catálogo
            function renderCatalog(diseasesToRender) {
                const grid = $('#diseaseGrid');
                grid.empty();

                if (diseasesToRender.length === 0) {
                    grid.html(`
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-search" style="font-size: 4rem; color: rgba(255,255,255,0.3);"></i>
                            <h5 class="text-white mt-3">Nenhuma doença encontrada</h5>
                            <p class="text-muted">Tente ajustar os filtros ou a pesquisa.</p>
                        </div>
                    `);
                    return;
                }

                diseasesToRender.forEach(disease => {
                    const severityClass = {
                        'baixa': 'severity-low',
                        'moderada': 'severity-moderate',
                        'alta': 'severity-high'
                    }[disease.gravidade] || '';

                    grid.append(`
                        <div class="col-lg-4 col-md-6 col-sm-12 mb-4 fade-in">
                            <div class="disease-card" data-id="${disease.id}">
                                <img src="${disease.imagem}" class="card-img-top" alt="${disease.nome}">
                                <div class="card-body">
                                    <h5 class="card-title">${disease.nome}</h5>
                                    <div class="mb-2">
                                        <span class="badge-category">${disease.categoriaNome}</span>
                                        <span class="badge-severity ${severityClass}">${disease.gravidade.charAt(0).toUpperCase() + disease.gravidade.slice(1)}</span>
                                    </div>
                                    <p class="card-text">${disease.descricao}</p>
                                    <div class="d-flex justify-content-between align-items-center mt-3">
                                        <button class="btn btn-primary btn-sm btn-saber-mais" data-id="${disease.id}">
                                            <i class="bi bi-book"></i> Saber Mais
                                        </button>
                                        <button class="btn btn-outline-light btn-sm btn-favorito" data-id="${disease.id}">
                                            <i class="bi ${favorites.includes(disease.id) ? 'bi-heart-fill text-danger' : 'bi-heart'}"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // Renderizar detalhes da doença
            function renderDetail(disease) {
                if (!disease) return;

                currentDisease = disease;
                addToHistory(disease.id);

                const severityClass = {
                    'baixa': 'severity-low',
                    'moderada': 'severity-moderate',
                    'alta': 'severity-high'
                }[disease.gravidade] || '';

                // Construir FAQ
                let faqHtml = '';
                if (disease.faq && disease.faq.length > 0) {
                    disease.faq.forEach(item => {
                        faqHtml += `
                            <div class="faq-item">
                                <strong><i class="bi bi-question-circle text-primary me-2"></i>${item.pergunta}</strong>
                                <p class="mb-0 mt-2">${item.resposta}</p>
                            </div>
                        `;
                    });
                }

                // Conteúdos relacionados
                let relatedHtml = '';
                if (disease.relacionados && disease.relacionados.length > 0) {
                    disease.relacionados.forEach(rel => {
                        const relDisease = diseases.find(d => d.nome === rel);
                        if (relDisease) {
                            relatedHtml += `
                                <span class="related-card" data-id="${relDisease.id}">${rel}</span>
                            `;
                        } else {
                            relatedHtml += `
                                <span class="related-card">${rel}</span>
                            `;
                        }
                    });
                }

                const html = `
                    <div class="detail-header">
                        <img src="${disease.imagem}" alt="${disease.nome}">
                        <div class="title">
                            <h2>${disease.nome}</h2>
                            <div class="subtitle">
                                <span class="badge-category me-2">${disease.categoriaNome}</span>
                                <span class="badge-severity ${severityClass}">${disease.gravidade.charAt(0).toUpperCase() + disease.gravidade.slice(1)}</span>
                                <span class="ms-2"><i class="bi bi-hospital"></i> ${disease.especialidade}</span>
                            </div>
                        </div>
                    </div>
                    <div class="detail-content">
                        <h5><i class="bi bi-info-circle section-icon"></i>Descrição</h5>
                        <p>${disease.descricao}</p>

                        <h5><i class="bi bi-question-lg section-icon"></i>O que é?</h5>
                        <p>${disease.oque_e}</p>

                        <h5><i class="bi bi-exclamation-triangle section-icon"></i>Causas</h5>
                        <ul>
                            ${disease.causas.map(c => `<li>${c}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-shield section-icon"></i>Fatores de Risco</h5>
                        <ul>
                            ${disease.fatores_risco.map(f => `<li>${f}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-clipboard-pulse section-icon"></i>Sintomas</h5>
                        <ul>
                            ${disease.sintomas.map(s => `<li>${s}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-heart-pulse section-icon"></i>Como Prevenir</h5>
                        <ul>
                            ${disease.prevencao.map(p => `<li>${p}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-stethoscope section-icon"></i>Diagnóstico</h5>
                        <p>${disease.diagnostico}</p>

                        <h5><i class="bi bi-capsule section-icon"></i>Tratamento</h5>
                        <ul>
                            ${disease.tratamento.map(t => `<li>${t}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-hand-thumbs-up section-icon"></i>Cuidados a Ter</h5>
                        <ul>
                            ${disease.cuidados.map(c => `<li>${c}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-exclamation-diamond section-icon"></i>Possíveis Complicações</h5>
                        <ul>
                            ${disease.complicacoes.map(c => `<li>${c}</li>`).join('')}
                        </ul>

                        <h5><i class="bi bi-person-plus section-icon"></i>Especialidade Médica Indicada</h5>
                        <p><strong>${disease.especialidade}</strong></p>

                        ${faqHtml ? `<h5><i class="bi bi-question-circle section-icon"></i>Perguntas Frequentes (FAQ)</h5>${faqHtml}` : ''}

                        ${relatedHtml ? `
                            <h5><i class="bi bi-diagram-3 section-icon"></i>Conteúdos Relacionados</h5>
                            <div class="mb-3">${relatedHtml}</div>
                        ` : ''}

                        <div class="disclaimer">
                            <i class="bi bi-info-circle me-2"></i>
                            <strong>As informações disponibilizadas nesta secção têm caráter exclusivamente educativo e informativo.</strong>
                            Elas não substituem a avaliação, o diagnóstico ou o tratamento realizado por um profissional de saúde qualificado. 
                            Em caso de sintomas ou dúvidas, procure assistência médica.
                        </div>
                    </div>
                `;

                $('#diseaseDetail').html(html);
                $('#catalogContainer').hide();
                $('#detailContainer').show();

                // Scroll para o topo
                $('html, body').animate({ scrollTop: 0 }, 300);
            }

            // ===================== FUNÇÕES AUXILIARES =====================

            function addToHistory(diseaseId) {
                if (!history.includes(diseaseId)) {
                    history.push(diseaseId);
                    if (history.length > 20) history.shift();
                    localStorage.setItem('diseaseHistory', JSON.stringify(history));
                }
            }

            function toggleFavorite(diseaseId) {
                const index = favorites.indexOf(diseaseId);
                if (index === -1) {
                    favorites.push(diseaseId);
                } else {
                    favorites.splice(index, 1);
                }
                localStorage.setItem('favorites', JSON.stringify(favorites));
                // Re-renderizar
                renderCatalog(filteredDiseases);
            }

            function applyFilters() {
                const searchTerm = $('#searchDisease').val().toLowerCase();
                const category = $('#filterCategory').val();
                const severityFilters = [];
                if ($('#sevLow').is(':checked')) severityFilters.push('baixa');
                if ($('#sevModerate').is(':checked')) severityFilters.push('moderada');
                if ($('#sevHigh').is(':checked')) severityFilters.push('alta');
                const sintomasFilter = $('#filterSintomas').val().toLowerCase();

                filteredDiseases = diseases.filter(d => {
                    // Pesquisa por nome
                    if (searchTerm && !d.nome.toLowerCase().includes(searchTerm) &&
                        !d.sintomas.some(s => s.toLowerCase().includes(searchTerm)) &&
                        !d.especialidade.toLowerCase().includes(searchTerm)) {
                        return false;
                    }

                    // Filtro por categoria
                    if (category && d.categoria !== category) {
                        return false;
                    }

                    // Filtro por gravidade
                    if (severityFilters.length > 0 && !severityFilters.includes(d.gravidade)) {
                        return false;
                    }

                    // Filtro por sintomas
                    if (sintomasFilter && !d.sintomas.some(s => s.toLowerCase().includes(sintomasFilter))) {
                        return false;
                    }

                    return true;
                });

                renderCatalog(filteredDiseases);
            }

            // ===================== EVENTOS =====================

            // Carregar catálogo inicial
            renderCatalog(diseases);

            // Pesquisa
            $('#btnSearch').click(applyFilters);
            $('#searchDisease').on('keyup', function(e) {
                if (e.key === 'Enter') applyFilters();
            });

            // Filtro de categoria
            $('#filterCategory').change(applyFilters);

            // Botões de categoria
            $('.category-btn').click(function() {
                $('.category-btn').removeClass('active');
                $(this).addClass('active');
                const category = $(this).data('category');
                if (category === 'all') {
                    $('#filterCategory').val('');
                } else {
                    $('#filterCategory').val(category);
                }
                applyFilters();
            });

            // Saber mais
            $(document).on('click', '.btn-saber-mais', function() {
                const id = parseInt($(this).data('id'));
                const disease = diseases.find(d => d.id === id);
                if (disease) {
                    renderDetail(disease);
                }
            });

            // Clique no card
            $(document).on('click', '.disease-card', function(e) {
                if ($(e.target).closest('.btn-favorito').length) return;
                const id = parseInt($(this).data('id'));
                const disease = diseases.find(d => d.id === id);
                if (disease) {
                    renderDetail(disease);
                }
            });

            // Favoritos
            $(document).on('click', '.btn-favorito', function(e) {
                e.stopPropagation();
                const id = parseInt($(this).data('id'));
                toggleFavorite(id);
            });

            // Botão voltar
            $('#btnBackToCatalog').click(function() {
                $('#detailContainer').hide();
                $('#catalogContainer').show();
                renderCatalog(filteredDiseases);
                $('html, body').animate({ scrollTop: 0 }, 300);
            });

            // Filtros avançados
            $('#btnFiltros').click(function() {
                $('#filtersModal').modal('show');
            });

            $('#btnApplyFilters').click(function() {
                $('#filtersModal').modal('hide');
                applyFilters();
            });

            // Favoritos
            $('#btnFavoritos').click(function() {
                if (favorites.length === 0) {
                    alert('Você ainda não tem doenças favoritas.');
                    return;
                }
                const favDiseases = diseases.filter(d => favorites.includes(d.id));
                if (favDiseases.length > 0) {
                    $('#detailContainer').hide();
                    $('#catalogContainer').show();
                    renderCatalog(favDiseases);
                    $('#filterCategory').val('');
                    $('#searchDisease').val('');
                }
            });

            // Histórico
            $('#btnHistorico').click(function() {
                if (history.length === 0) {
                    alert('Você ainda não visualizou nenhuma doença.');
                    return;
                }
                const histDiseases = diseases.filter(d => history.includes(d.id));
                if (histDiseases.length > 0) {
                    $('#detailContainer').hide();
                    $('#catalogContainer').show();
                    renderCatalog(histDiseases);
                    $('#filterCategory').val('');
                    $('#searchDisease').val('');
                }
            });

            // Modo leitura
            $('#btnModoLeitura').click(function() {
                readingMode = !readingMode;
                if (readingMode) {
                    $('.detail-section').addClass('reading-mode');
                    $('.detail-section .detail-content p, .detail-section .detail-content li').css('font-size', '1.2rem');
                    $('#btnModoLeitura').html('<i class="bi bi-eye-slash"></i> Modo Normal');
                } else {
                    $('.detail-section').removeClass('reading-mode');
                    $('.detail-section .detail-content p, .detail-section .detail-content li').css('font-size', '');
                    $('#btnModoLeitura').html('<i class="bi bi-eye"></i> Modo Leitura');
                }
            });

            // Conteúdos relacionados
            $(document).on('click', '.related-card', function() {
                const id = parseInt($(this).data('id'));
                if (id) {
                    const disease = diseases.find(d => d.id === id);
                    if (disease) {
                        renderDetail(disease);
                    }
                }
            });

            console.log('✅ Dicionário de Doenças - VITALINKA carregado com sucesso!');
        });
    </script>
</body>
</html>
